[project]
name = "exam-generator-backend"
version = "0.2.0"
description = "Python sidecar backend for Exam Generator Desktop"
requires-python = ">=3.12,<3.14"
dependencies = ["pypdf>=4", "pdfplumber>=0.11", "httpx>=0.28", "keyring>=25", "PyJWT[crypto]>=2.10"]

[project.optional-dependencies]
build = ["pyinstaller>=6"]
benchmark = ["torch>=2.2,<3", "transformers>=5.16,<6", "huggingface-hub>=1,<2"]
documents = ["docling-slim[convert-core,format-docx,format-pptx]==2.148.0", "ocrmac>=1; sys_platform == 'darwin'", "pypdfium2>=4", "Pillow>=11"]

[project.scripts]
exam-generator-backend = "exam_backend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["exam_backend*"]

[tool.setuptools.package-data]
exam_backend = ["templates/*"]
