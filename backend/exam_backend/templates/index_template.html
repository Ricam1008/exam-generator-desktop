<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Exam</title>
  <style>
{{ styles }}
  </style>
</head>
<body>
  <main class="exam-shell">
    <header class="exam-header">
      <div>

        <h1 id="exam-title">Loading exam...</h1>
        <p id="exam-meta" class="meta-line"></p>
      </div>
      <div class="settings-panel" aria-label="Local grading server">
        <strong>Feedback zu offenen Antworten</strong>
        <p id="grading-info"></p>
      </div>
    </header>

    <section id="warning-box" class="warning" hidden></section>

    <nav class="progress-card" aria-label="Exam progress">
      <div>
        <strong id="progress-count">0 / 0 answered</strong>
        <span id="save-status" role="status" aria-live="polite"></span>
      </div>
      <progress id="progress-bar" max="100" value="0"></progress>
    </nav>

    <section class="section-head">
      <h2 id="mc-heading">Multiple-Choice-Fragen</h2>
      <p id="mc-hint"></p>
    </section>
    <form id="mc-form" class="question-list"></form>
    <div class="actions">
      <button id="check-mc" type="button">Check multiple-choice answers</button>
    </div>
    <section id="mc-summary" class="summary" hidden></section>

    <section class="section-head">
      <h2 id="open-heading">Offene Fragen</h2>
      <p id="open-hint"></p>
    </section>
    <form id="open-form" class="question-list"></form>
    <div class="actions">
      <button id="grade-open" type="button">Grade open answers with LLM</button>
      <button id="skip-open" type="button" class="secondary">Continue without LLM grading</button>
    </div>
    <section id="open-summary" class="summary" hidden></section>

    <section id="score-summary" class="score-summary" hidden></section>
  </main>
  <script id="embedded-exam-data" type="application/json">
{{ exam_json }}
  </script>
  <script>
{{ script }}
  </script>
</body>
</html>
